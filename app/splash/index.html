<!doctype html>
<html><head><meta charset="utf-8"><title>Phosphene</title>
<style>
  html, body { margin: 0; height: 100%; background: #121110; color: #A8A390; font: 13px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; -webkit-user-select: none; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #EC540C; box-shadow: 0 0 0 10px rgba(236, 84, 12, .18), 0 0 0 22px rgba(236, 84, 12, .07); animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { box-shadow: 0 0 0 14px rgba(236, 84, 12, .12), 0 0 0 30px rgba(236, 84, 12, .04); } }
  #msg { max-width: 420px; text-align: center; line-height: 1.6; }
</style></head>
<body><div class="dot"></div><div id="msg">Starting Phosphene…</div></body></html>
