[package]
name = "phosphene"
version = "0.1.2"
description = "Phosphene: match-cut films around a brand mark"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
opt-level = "s"

# macOS 27 refuses to load a stripped proc-macro dylib ("mis-aligned LINKEDIT string pool"): the build-time helpers are not stripped
[profile.release.build-override]
strip = false
debug = false
